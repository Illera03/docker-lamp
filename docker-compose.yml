web:
   image: web
   environment:
     - ALLOW_OVERRIDE=true
   ports:
     - "81:80"
   links:
     - db
   volumes:
     - ./app:/var/www/html/
     - ./logs:/var/log/app_logs/  # Mapeo de la carpeta de logs

db:
  image: mariadb:10.8.2
  restart: always
  volumes:
    - ./mysql:/var/lib/mysql
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_USER: admin__sgssi
    MYSQL_PASSWORD: u31sg0909
    MYSQL_DATABASE: database
  ports:
    - "8889:3306"

phpmyadmin:
  image: phpmyadmin/phpmyadmin:latest
  links:
    - db
  ports:
    - 8890:80
  environment:
    MYSQL_USER: admin__abd
    MYSQL_PASSWORD: 0102005
    MYSQL_DATABASE: database
