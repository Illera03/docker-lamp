web:
   image: web
   environment:
     - ALLOW_OVERRIDE=true
     - ENCRYPTION_KEY=tu-clave-secreta-aqui
   ports:
     - "81:80"
   links:
     - db
   volumes:
     - ./app:/var/www/html/
     - ./logs:/var/log/app_logs/  # Mapeo de la carpeta de logs

db:
  image: mariadb:10.9
  restart: always
  volumes:
    - ./mysql:/var/lib/mysql
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_USER: admin_SgSSi
    MYSQL_PASSWORD: U31sg09_09
    MYSQL_DATABASE: database
  ports:
    - "8889:3306"

phpmyadmin:
  image: phpmyadmin/phpmyadmin:5.1.1
  links:
    - db
  ports:
    - 8890:80
  environment:
    MYSQL_USER: admin_SgSSi
    MYSQL_PASSWORD: U31sg09_09
    MYSQL_DATABASE: database
